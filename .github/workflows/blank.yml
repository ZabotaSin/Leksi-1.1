name: Build Leksi APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  ANDROID_PROJECT_ZIP: Leksi_Offline_Android_Project_v1.1.1_Fix.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh source from the fixed Leksi ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$ANDROID_PROJECT_ZIP"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Expected $ZIP_FILE in the repository root. Upload the fixed project ZIP first."
            echo "ZIP files currently in the root:"
            find . -maxdepth 1 -type f -iname '*.zip' -print || true
            exit 1
          fi
          rm -rf .leksi_unpack
          mkdir -p .leksi_unpack
          unzip -q "$ZIP_FILE" -d .leksi_unpack
          PROJECT_ROOT="$(find .leksi_unpack -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: ZIP does not contain settings.gradle.kts"
            exit 1
          fi
          echo "Using project source from: $PROJECT_ROOT"
          cp -R "$PROJECT_ROOT"/. .
          echo "Checking DAILY branch in source:"
          grep -n -A2 -B2 'StudyMode.DAILY' app/src/main/java/app/leksi/offline/MainActivity.kt
          if ! grep -q 'StudyMode.DAILY' app/src/main/java/app/leksi/offline/MainActivity.kt; then
            echo "ERROR: Updated MainActivity.kt does not contain the DAILY branch."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Leksi-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

