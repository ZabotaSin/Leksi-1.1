name: Build Leksi APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract existing Leksi project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Leksi_Offline_Android_Project_v1.1.0.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Could not find $ZIP_FILE in the repository root."
            echo "ZIP files in root:"
            find . -maxdepth 1 -type f -iname '*.zip' -print || true
            exit 1
          fi
          rm -rf .leksi_unpack
          mkdir -p .leksi_unpack
          unzip -q "$ZIP_FILE" -d .leksi_unpack
          PROJECT_ROOT="$(find .leksi_unpack -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: settings.gradle.kts was not found inside the ZIP."
            exit 1
          fi
          cp -R "$PROJECT_ROOT"/. .

      - name: Patch missing DAILY branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/leksi/offline/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          marker = '} else when (mode) {\n            StudyMode.CARDS -> {'
          replacement = '} else when (mode) {\n            // DAILY content is displayed by DailyChallengeScreen above.\n            StudyMode.DAILY -> Unit\n            StudyMode.CARDS -> {'
          if 'StudyMode.DAILY -> Unit' not in s:
              if marker not in s:
                  raise SystemExit('ERROR: Expected when(mode) block not found; source layout differs.')
              s = s.replace(marker, replacement, 1)
              p.write_text(s, encoding='utf-8')
          if 'StudyMode.DAILY -> Unit' not in p.read_text(encoding='utf-8'):
              raise SystemExit('ERROR: DAILY branch patch failed.')
          print('Verified: StudyMode.DAILY branch exists.')
          PY
          grep -n -A4 -B2 'StudyMode.DAILY -> Unit' app/src/main/java/app/leksi/offline/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Leksi-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
